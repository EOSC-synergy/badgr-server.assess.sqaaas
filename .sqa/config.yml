config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/badgr-server:
      branch: develop
      repo: https://github.com/PalomoIFCA/badgr-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.azure_upbeat_baboon.sh
        container: qc.acc_dawn_diligent_sparrow
  QC.Doc:
    repos:
      github.com/PalomoIFCA/badgr-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.peach_spirited_koala.sh
        container: qc.doc_dawn_graceful_cougar
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.scarlet_vibrant_thrush.sh
        container: qc.doc_periwinkle_eccentric_raccoon
      github.com/PalomoIFCA/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.jade_motivated_mandrill.sh
        container: qc.doc_zinnia_blissful_quokka
  QC.Lic:
    repos:
      github.com/PalomoIFCA/badgr-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.pearl_helpful_parrot.sh
        container: qc.lic_fuchsia_courageous_sparrow
  QC.Sec:
    repos:
      github.com/PalomoIFCA/badgr-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.turmeric_skeptical_tiger.sh
        container: qc.sec_clove_enigmatic_roc
  QC.Sty:
    repos:
      github.com/PalomoIFCA/badgr-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.maroon_impulsive_tortoise.sh
        container: qc.sty_pink_serene_warthog
      github.com/PalomoIFCA/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.hunter_tactful_parrot.sh
        container: qc.sty_marina_rustic_groundhog
      github.com/PalomoIFCA/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.byzantium_sarcastic_butterfly.sh
        container: qc.sty_amethyst_exuberant_starfish
  QC.Uni:
    repos:
      github.com/PalomoIFCA/badgr-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_gracious_wasp.sh
        container: qc.uni_mustard_peaceful_wombat
  QC.Ver:
    repos:
      github.com/PalomoIFCA/badgr-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.brown_diligent_manatee.sh
        container: qc.ver_cerise_meticulous_ostrich
timeout: 5400
