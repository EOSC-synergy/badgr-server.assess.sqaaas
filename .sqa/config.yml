        container: qc.sty_cream_inventive_quoll
      github.com/PalomoIFCA/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_scrappy_lynx.sh
        container: qc.sty_incarnadine_eccentric_goose
      github.com/PalomoIFCA/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.carmine_intuitive_dingo.sh
        container: qc.sty_mint_devoted_flounder
