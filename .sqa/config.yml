config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/badgr-server:
      branch: Documentation-update
      repo: https://github.com/PalomoIFCA/badgr-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.puce_affectionate_hydra.sh
        container: qc.acc_yellow_exuberant_snail
  QC.Doc:
    repos:
      github.com/PalomoIFCA/badgr-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.powder_enigmatic_uakari.sh
        container: qc.doc_celadon_humble_bat
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.cayenne_lively_crocodile.sh
        container: qc.doc_nutmeg_jubilant_stork
      github.com/PalomoIFCA/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wine_harmonious_beaver.sh
        container: qc.doc_green_articulate_spider
  QC.Lic:
    repos:
      github.com/PalomoIFCA/badgr-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cobalt_productive_tiger.sh
        container: qc.lic_onyx_feisty_coyote
  QC.Sec:
    repos:
      github.com/PalomoIFCA/badgr-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.mulberry_stoic_stork.sh
        container: qc.sec_cardamom_ardent_sparrow
  QC.Sty:
    repos:
      github.com/PalomoIFCA/badgr-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.forest_tenacious_tiger.sh
        container: qc.sty_copper_tenacious_porpoise
      github.com/PalomoIFCA/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.flint_lively_pegasus.sh
        container: qc.sty_red_warm_okapi
      github.com/PalomoIFCA/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.celadon_brilliant_leopard.sh
        container: qc.sty_forest_curious_kookaburra
  QC.Uni:
    repos:
      github.com/PalomoIFCA/badgr-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.grape_bright_anaconda.sh
        container: qc.uni_snow_agile_python
