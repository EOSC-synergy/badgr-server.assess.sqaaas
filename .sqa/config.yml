config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/badgr-server:
      branch: develop
      repo: https://github.com/PalomoIFCA/badgr-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.malachite_peaceful_cockatoo.sh
        container: qc.acc_thistle_productive_catfish
  QC.Doc:
    repos:
      github.com/PalomoIFCA/badgr-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.mint_quirky_hippopotamus.sh
        container: qc.doc_clove_diligent_stork
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.verdant_savvy_gnu.sh
        container: qc.doc_banana_fearless_crow
      github.com/PalomoIFCA/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.aquamarine_stubborn_hydra.sh
        container: qc.doc_tide_reliable_bison
  QC.Lic:
    repos:
      github.com/PalomoIFCA/badgr-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.linen_amiable_impala.sh
        container: qc.lic_orchid_resourceful_antelope
  QC.Sec:
    repos:
      github.com/PalomoIFCA/badgr-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.raspberry_ambitious_squirrel.sh
        container: qc.sec_glacier_vigilant_okapi
  QC.Sty:
    repos:
      github.com/PalomoIFCA/badgr-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.rust_attentive_hawk.sh
        container: qc.sty_ash_calm_squirrel
      github.com/PalomoIFCA/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.sepia_eager_warthog.sh
        container: qc.sty_claret_eager_dolphin
      github.com/PalomoIFCA/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_bubbly_puffin.sh
        container: qc.sty_cream_realistic_wolverine
  QC.Uni:
    repos:
      github.com/PalomoIFCA/badgr-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.porcelain_balanced_unicorn.sh
        container: qc.uni_tangerine_plucky_butterfly
  QC.Ver:
    repos:
      github.com/PalomoIFCA/badgr-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.bluebell_forgiving_gerbil.sh
        container: qc.ver_lapis_pensive_armadillo
timeout: 5400
