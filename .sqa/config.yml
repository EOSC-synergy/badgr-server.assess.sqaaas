config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/open-educational-badges/badgr-server:
      branch: develop
      repo: https://github.com/open-educational-badges/badgr-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/open-educational-badges/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.caramel_forgiving_whale.sh
        container: qc.acc_thistle_loyal_iguana
  QC.Doc:
    repos:
      github.com/open-educational-badges/badgr-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_dreamy_goose.sh
        container: qc.doc_olive_shy_quokka
      github.com/open-educational-badges/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.ecru_calm_lynx.sh
        container: qc.doc_papaya_joyful_moth
      github.com/open-educational-badges/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.turmeric_affectionate_puffin.sh
        container: qc.doc_watermelon_eager_raven
  QC.Lic:
    repos:
      github.com/open-educational-badges/badgr-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.magenta_scrappy_pangolin.sh
        container: qc.lic_steel_sweet_spren
  QC.Sec:
    repos:
      github.com/open-educational-badges/badgr-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.currant_outgoing_hawk.sh
        container: qc.sec_jasmine_generous_weasel
  QC.Sty:
    repos:
      github.com/open-educational-badges/badgr-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_bewildered_gull.sh
        container: qc.sty_pansy_realistic_octopus
      github.com/open-educational-badges/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.mauve_nurturing_roadrunner.sh
        container: qc.sty_lavender_friendly_shark
      github.com/open-educational-badges/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_zealous_orangutan.sh
        container: qc.sty_gunmetal_easygoing_gerbil
  QC.Uni:
    repos:
      github.com/open-educational-badges/badgr-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.jade_forgiving_boar.sh
        container: qc.uni_avocado_rugged_rhinoceros
  QC.Ver:
    repos:
      github.com/open-educational-badges/badgr-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.heather_sad_tiger.sh
        container: qc.ver_cerulean_outgoing_hummingbird
timeout: 5400
