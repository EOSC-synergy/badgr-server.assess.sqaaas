        commands:
        - /usr/bin/env sh .sqa/script.wave_kind_falcon.sh
        container: qc.doc_mulberry_inspired_piranha
      github.com/edubadges/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.maroon_proactive_tarantula.sh
        container: qc.doc_horizon_assured_rattlesnake
