        - /usr/bin/env sh .sqa/script.fuchsia_courageous_crow.sh
        container: qc.doc_fandango_wise_dugong
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_wondrous_alpaca.sh
        container: qc.doc_harlequin_perky_toucan
      github.com/PalomoIFCA/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.snow_nurturing_manta.sh
        container: qc.doc_copper_savvy_flounder
  QC.Lic:
