      github.com/PalomoIFCA/badgr-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.nutmeg_pensive_osprey.sh
        container: qc.sty_pineapple_delighted_gibbon
      github.com/PalomoIFCA/badgr-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.silver_nervous_ostrich.sh
        container: qc.sty_bone_fair_starfish
      github.com/PalomoIFCA/badgr-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_kind_groundhog.sh
        container: qc.sty_bluebell_dreamy_eel
  QC.Uni:
