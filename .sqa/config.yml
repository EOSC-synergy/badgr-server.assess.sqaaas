config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/badgr-server:
      branch: develop
      repo: https://github.com/PalomoIFCA/badgr-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.puce_ambitious_wolf.sh
        container: qc.acc_wheat_eccentric_ocelot
  QC.Doc:
    repos:
      github.com/PalomoIFCA/badgr-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_resourceful_owl.sh
        container: qc.doc_wheat_enigmatic_cockatoo
      github.com/PalomoIFCA/badgr-server git:
        commands:
        - /usr/bin/env sh .sqa/script.strawberry_amused_macaw.sh
        container: qc.doc_aqua_patient_osprey
      github.com/PalomoIFCA/badgr-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.plum_responsible_gorilla.sh
        container: qc.doc_fandango_sad_tapir
  QC.Lic:
    repos:
      github.com/PalomoIFCA/badgr-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.heather_stubborn_lionfish.sh
        container: qc.lic_echelon_affectionate_ocelot
  QC.Sec:
